name: Browser
options:
  bundleIdPrefix: dev.athas
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    # The release workflow sets both from the version tag and the commit count.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # The release workflow downloads Sparkle's signing tools for this same version.
    exactVersion: 2.10.0
targetTemplates:
  BrowserApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/Browser
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: Browser
        PRODUCT_MODULE_NAME: Browser
        PRODUCT_BUNDLE_IDENTIFIER: dev.athas.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Browser
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for calls.
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_FILE_ACCESS_DOWNLOADS_FOLDER: readwrite
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_RESOURCE_ACCESS_PRINTING: YES
        # Passkeys need Apple's managed web browser entitlement and a provisioning profile that includes it (see
        # RELEASING.md). Build with BROWSER_PASSKEYS=YES to sign with the entitlements file that adds it.
        BROWSER_PASSKEYS: NO
        PASSKEYS_ENTITLEMENTS_SUFFIX_YES: -Passkeys
        # iCloud sync of bookmarks and open tabs needs the CloudKit container in the provisioning profile (see
        # RELEASING.md). Build with BROWSER_ICLOUD=YES to sign with the entitlements file that adds it.
        BROWSER_ICLOUD: NO
        ICLOUD_ENTITLEMENTS_SUFFIX_YES: -iCloud
targets:
  # The Mac App Store build: the same app without Sparkle, which the store updates instead.
  BrowserAppStore:
    templates:
      - BrowserApp
    info:
      path: Config/BrowserAppStore-Info.plist
      properties: &sharedInfo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
            CFBundleTypeRole: Viewer
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html]
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.xhtml]
        # Pages may load over plain HTTP, like in any browser. The app's own connections still need HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/BrowserAppStore$(PASSKEYS_ENTITLEMENTS_SUFFIX_$(BROWSER_PASSKEYS))$(ICLOUD_ENTITLEMENTS_SUFFIX_$(BROWSER_ICLOUD)).entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
  # Distributed directly with a Developer ID, and updated with Sparkle.
  Browser:
    templates:
      - BrowserApp
    sources:
      # Sparkle's license travels with the app that includes it.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Config/Browser-Info.plist
      properties:
        <<: *sharedInfo
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        # A sandboxed app installs updates through Sparkle's installer service.
        SUEnableInstallerLauncherService: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Browser$(PASSKEYS_ENTITLEMENTS_SUFFIX_$(BROWSER_PASSKEYS))$(ICLOUD_ENTITLEMENTS_SUFFIX_$(BROWSER_ICLOUD)).entitlements
        SPARKLE_FEED_URL: https://github.com/athasdev/browser/releases/latest/download/appcast.xml
        # PLACEHOLDER, not a real key: replace it with the public key Sparkle's generate_keys prints (see
        # RELEASING.md). Updates stay off until it's set; the release workflow can also pass it in.
        SPARKLE_PUBLIC_ED_KEY: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY
  # The browser on iPhone and iPad, sharing bookmarks, search, and iCloud sync with the Mac.
  BrowserMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: Sources/Mobile
      - path: Sources/Shared
    info:
      path: Config/BrowserMobile-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Browser
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
                                           UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Websites you allow can use the camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone, for example for calls.
        NSUserActivityTypes: [NSUserActivityTypeBrowsingWeb]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_NAME: Browser
        PRODUCT_MODULE_NAME: BrowserMobile
        PRODUCT_BUNDLE_IDENTIFIER: dev.athas.browser.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.4"
        # Same as the Mac: BROWSER_ICLOUD=YES signs with iCloud and turns sync on.
        BROWSER_ICLOUD: NO
        ICLOUD_ENTITLEMENTS_SUFFIX_YES: -iCloud
        ICLOUD_CONDITION_YES: ICLOUD_SYNC
        CODE_SIGN_ENTITLEMENTS: Config/BrowserMobile$(ICLOUD_ENTITLEMENTS_SUFFIX_$(BROWSER_ICLOUD)).entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(ICLOUD_CONDITION_$(BROWSER_ICLOUD))
  BrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BrowserTests
    dependencies:
      - target: Browser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.athas.browser.tests
        GENERATE_INFOPLIST_FILE: YES
